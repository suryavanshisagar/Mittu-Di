<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Mittu ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(145deg, #fdf7f2, #f7e4de, #f3e6cc);
      color: #3a2e2c;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #ffffff;
      border-radius: 26px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 16px 35px rgba(90, 62, 54, 0.08);
    }

    .icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 13px;
      color: #7c6b66;
      margin-bottom: 20px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid #d1867e;
      background: transparent;
      transition: 0.2s ease;
    }

    .dot.active {
      background: #d1867e;
      transform: scale(1.15);
    }

    .dot.ok {
      background: #c49752;
      border-color: #c49752;
    }

    .msg {
      min-height: 34px;
      font-size: 12.5px;
      font-weight: 500;
      color: #b84a42;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .msg.ok {
      color: #9e7432;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 240px;
      margin: 0 auto 18px;
    }

    .btn {
      height: 62px;
      width: 62px;
      margin: 0 auto;
      border-radius: 50%;
      border: 1px solid rgba(209, 134, 126, 0.35);
      background: #ffffff;
      color: #3a2e2c;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:active {
      transform: scale(0.92);
      background: #f7e4de;
    }

    .btn.small {
      font-size: 13px;
      color: #7c6b66;
      background: #faf4f0;
    }

    .hint-btn {
      background: none;
      border: none;
      color: #7c6b66;
      font-size: 12.5px;
      text-decoration: underline;
      cursor: pointer;
    }

    .hint-box {
      display: none;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: #fdf6ee;
      font-size: 12.5px;
      color: #4a3a37;
    }

    .hint-box.show {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .shake {
      animation: shake 0.35s ease;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">🔒</div>
    <h1>For Mittu ✨</h1>
    <p class="sub">Enter 6-digit passcode to open</p>

    <div class="dots" id="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="msg" id="msg"></div>

    <div class="keypad">
      <button class="btn" onclick="press('1')">1</button>
      <button class="btn" onclick="press('2')">2</button>
      <button class="btn" onclick="press('3')">3</button>
      <button class="btn" onclick="press('4')">4</button>
      <button class="btn" onclick="press('5')">5</button>
      <button class="btn" onclick="press('6')">6</button>
      <button class="btn" onclick="press('7')">7</button>
      <button class="btn" onclick="press('8')">8</button>
      <button class="btn" onclick="press('9')">9</button>
      <button class="btn small" onclick="clearCode()">Clear</button>
      <button class="btn" onclick="press('0')">0</button>
      <button class="btn small" onclick="backCode()">⌫</button>
    </div>

    <button class="hint-btn" onclick="toggleHint()">Need a hint?</button>
    <div class="hint-box" id="hintBox">The day a legend was born (DDMMYY) ✨</div>
  </div>

  <script>
    const PASSCODE = "231105";
    const NEXT_PAGE = "page2.html";
    const WRONG_MSGS = [
      "Arre CA sahiba, itna easy calculation galat? Try again! 😜",
      "Balance sheet match nahi hui! Ek baar aur try karo Mittu 😅",
      "Oops! Galat code hai, neeche hint dekh lo ✨"
    ];

    let pin = "";
    let wrongCount = 0;
    let locked = false;

    function renderDots(state = "") {
      const dots = document.querySelectorAll(".dot");
      dots.forEach((d, i) => {
        d.classList.remove("active", "ok");
        if (state === "ok") {
          d.classList.add("ok");
        } else if (i < pin.length) {
          d.classList.add("active");
        }
      });
    }

    function press(num) {
      if (locked || pin.length >= 6) return;
      if (pin.length === 0) {
        const msg = document.getElementById("msg");
        msg.textContent = "";
        msg.classList.remove("ok");
      }
      pin += num;
      renderDots();

      if (pin.length === 6) {
        checkPin();
      }
    }

    function backCode() {
      if (locked || pin.length === 0) return;
      pin = pin.slice(0, -1);
      renderDots();
    }

    function clearCode() {
      if (locked) return;
      pin = "";
      document.getElementById("msg").textContent = "";
      renderDots();
    }

    function checkPin() {
      locked = true;
      const msg = document.getElementById("msg");
      const dotsEl = document.getElementById("dots");

      if (pin === PASSCODE) {
        renderDots("ok");
        document.getElementById("icon").textContent = "🔓";
        msg.classList.add("ok");
        msg.textContent = "Unlocked! Happy Birthday Mittu ✨";
        setTimeout(() => {
          window.location.href = NEXT_PAGE;
        }, 800);
      } else {
        msg.textContent = WRONG_MSGS[wrongCount % WRONG_MSGS.length];
        wrongCount++;
        dotsEl.classList.add("shake");
        setTimeout(() => {
          dotsEl.classList.remove("shake");
          pin = "";
          renderDots();
          locked = false;
        }, 450);
      }
    }

    function toggleHint() {
      document.getElementById("hintBox").classList.toggle("show");
    }
  </script>
</body>
</html>
