<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mittu ✨ | Unlock Your Surprise</title>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-cream: #FDF8F5;
            --bg-blush: #F7E6E1;
            --bg-gold: #F5EBD6;
            --text-dark: #3B2F2F;
            --text-muted: #8C7A75;
            --accent-rose: #D48C84;
            --accent-gold: #C59B5F;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 20px 40px rgba(92, 64, 56, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-blush) 50%, var(--bg-gold) 100%);
            color: var(--text-dark);
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Subtle Floating Musical Notes & Bokeh Background */
        .bg-decor {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-item {
            position: absolute;
            color: var(--accent-rose);
            opacity: 0.18;
            font-size: 1.5rem;
            animation: floatUp 14s infinite ease-in-out;
            user-select: none;
        }

        .bokeh {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            animation: pulse 8s infinite alternate ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.22; }
            80% { opacity: 0.22; }
            100% { transform: translateY(-15vh) rotate(25deg); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.25); opacity: 0.7; }
        }

        /* Main Glass Card */
        .vault-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid var(--glass-border);
            border-radius: 32px;
            padding: 36px 28px 32px;
            box-shadow: var(--shadow-soft);
            text-align: center;
            transition: transform 0.4s ease, opacity 0.5s ease;
        }
